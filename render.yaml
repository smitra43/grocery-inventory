# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Kroger keys aren't asked for here; add KROGER_CLIENT_ID and KROGER_CLIENT_SECRET
# later under the service's Environment tab when you want deals.
services:
  - type: web
    name: larder
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/kroger/status
    envVars:
      - key: APP_KEY
        generateValue: true
